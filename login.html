<body>
  <header>

    <p>مرحباً بعودتك! واصل رحلتك في اكتشاف إمكانياتك.</p>
    <nav aria-label="القائمة الرئيسية">

  <main>
    <section>
      <h2>تسجيل الدخول</h2>
      <p>أدخل بيانات حسابك للوصول إلى رحلتك في شِفرة.</p>
      <form action="#" method="post">
        <div>
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email" required>
        </div>
        <div>
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
        </div>
        <button type="submit">دخول</button>
      </form>
      <p>ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً</a></p>
      <p><a href="index.html">العودة إلى الصفحة الرئيسية</a></p>
    </section>
  </main>
  <footer><p>SHIFRA | شِفرة - اكتشف وجهتك في عالم الابتكار الرقمي</p></footer>
